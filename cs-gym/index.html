<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS Gym — Uninformed Search</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">CS</span>
    <div class="brand-text">
      <h1>Gym</h1>
      <p>Uninformed search &middot; 14 problems</p>
    </div>
  </div>

  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-label" id="progress-label">0 / 14 solved</span>
  </div>

  <div class="topbar-right">
    <span class="save-state" id="save-state"></span>
    <button class="btn btn-ghost btn-sm" id="btn-export"
            title="Download a backup of all your code and progress">Export</button>
    <label class="btn btn-ghost btn-sm" for="import-file"
           title="Restore from a backup file">Import</label>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <div class="runtime" id="runtime">
      <span class="dot" id="runtime-dot"></span>
      <span id="runtime-label">Booting Python…</span>
    </div>
  </div>
</header>

<div class="layout">

  <nav class="sidebar" id="sidebar" aria-label="Problem list"></nav>

  <main class="workspace">

    <section class="pane pane-brief">
      <div class="pane-head">
        <div class="tabs" role="tablist">
          <button class="tab is-active" data-view="brief" role="tab">Brief</button>
          <button class="tab" data-view="examples" role="tab">Examples</button>
          <button class="tab" data-view="hints" role="tab">Hints</button>
          <button class="tab" data-view="solution" role="tab">Solution</button>
        </div>
      </div>
      <div class="pane-body" id="brief-body"></div>
    </section>

    <section class="pane pane-code">
      <div class="pane-head">
        <div class="actions">
          <button class="btn btn-primary" id="btn-test" disabled>
            Run tests <kbd>&#8984;&#9166;</kbd>
          </button>
          <button class="btn" id="btn-run" disabled>Run</button>
          <button class="btn" id="btn-style" disabled>Style</button>
          <span class="spacer"></span>
          <button class="btn btn-ghost" id="btn-reset">Reset</button>
        </div>
      </div>

      <div class="editor" id="editor">
        <div class="gutter" id="gutter"></div>
        <div class="code-scroll" id="code-scroll">
          <pre class="highlight" id="highlight" aria-hidden="true"></pre>
          <textarea id="code" wrap="off" spellcheck="false" autocomplete="off"
                    autocapitalize="off" autocorrect="off"
                    aria-label="Python editor"></textarea>
        </div>
      </div>

      <div class="console" id="console">
        <div class="console-head">
          <span id="console-title">Console</span>
          <span class="console-meta" id="console-meta"></span>
        </div>
        <div class="console-body" id="console-body">
          <p class="muted">Pick a problem, write some Python, then hit
            <strong>Run tests</strong>. Everything executes in your browser.</p>
        </div>
      </div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
